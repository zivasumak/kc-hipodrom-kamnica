name: Preverjanje kode

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preverjanje:
    name: TypeScript in ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Prenos kode
        uses: actions/checkout@v7

      - name: Nastavitev Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Namestitev odvisnosti
        run: npm ci

      - name: Preverjanje TypeScript
        run: npx tsc --noEmit

      - name: Preverjanje ESLint
        run: npx eslint .
